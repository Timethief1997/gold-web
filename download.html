<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄金看板 · 下载中心</title>
<style>
  :root {
    --gold: #d4a017;
    --gold-dark: #b8860b;
    --bg: #f7f6f2;
    --card: #ffffff;
    --text: #1f1f1f;
    --muted: #777;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px;
  }
  .logo { font-size: 40px; margin-bottom: 8px; }
  h1 { font-size: 24px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 32px; text-align: center; line-height: 1.6; }
  .card {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,.06);
    padding: 28px 24px;
    width: 100%;
    max-width: 420px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 17px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .card .desc { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 18px; }
  .badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px;
    background: #f0ead3; color: var(--gold-dark); font-weight: 600; vertical-align: middle;
  }
  .btn {
    display: block; text-align: center; text-decoration: none; border-radius: 12px;
    padding: 14px 16px; font-size: 16px; font-weight: 600; transition: .2s;
  }
  .btn-download {
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: #fff;
  }
  .btn-download:hover { filter: brightness(1.05); transform: translateY(-1px); }
  .btn-line {
    background: #fff; color: var(--text); border: 1px solid #e3e3e3;
  }
  .btn-line:hover { border-color: var(--gold); color: var(--gold-dark); }
  .note { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.7; margin-top: 20px; }
  .file-info { font-size: 12px; color: var(--muted); margin-top: 12px; text-align: center; }
  .file-info b { color: var(--gold-dark); }
</style>
</head>
<body>
  <div class="logo">🥇</div>
  <h1>黄金看板 · 下载中心</h1>
  <div class="sub">实时金价 · 30天走势 · 影响因素 · 持仓记录<br>一个文件，任意设备离线打开</div>

  <div class="card">
    <h2>📦 离线单文件版 <span class="badge">推荐 · 可下载</span></h2>
    <div class="desc">
      全部代码内联在单个 HTML 中，下载后可在电脑 / 手机 / 平板直接用浏览器打开。
      <br>行情数据需联网获取；离线时界面仍可正常查看。
    </div>
    <a class="btn btn-download" href="gold-app-standalone.html" download="黄金看板_单文件便携版.html">⬇ 点击下载离线版</a>
    <div class="file-info">约 123 KB · 下载后直接双击打开</div>
  </div>

  <div class="card">
    <h2>🌐 在线版 <span class="badge">实时浏览</span></h2>
    <div class="desc">
      无需下载，直接在浏览器查看，与离线版功能一致。
    </div>
    <a class="btn btn-line" href="gold-local.html">打开在线版</a>
  </div>

  <div class="note">
    若点击下载后浏览器没有反应，请长按 / 右键 → 「链接另存为」即可。<br>
    手机端请用「浏览器打开」后点击下载。
  </div>
</body>
</html>
